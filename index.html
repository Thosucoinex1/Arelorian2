<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ouroboros: Axiom Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'axiom-dark': '#0a0a0f',
              'axiom-purple': '#4f46e5',
              'axiom-cyan': '#06b6d4',
              'axiom-gold': '#d97706',
              'soul-fire': '#ff4500'
            },
            fontFamily: {
              sans: ['Rajdhani', 'sans-serif'],
              serif: ['Cinzel', 'serif'],
            },
            keyframes: {
              scan: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(400%)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body { margin: 0; background-color: #050505; color: white; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #0f0f15; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
